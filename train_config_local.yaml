# LocalBackend RL configuration — mirrors train_config.yaml but wired for
# on-prem 8×H100 training with KL anchor against the SFT checkpoint.
#
# Run via:
#   uv run python local/run_pipeline_local.py
# or standalone:
#   uv run python local/pull_sft_lora.py  --config train_config_local.yaml
#   uv run python local/train_tau2_local.py --config train_config_local.yaml
#   uv run python local/upload_rl_lora.py  --config train_config_local.yaml

# ── Model ─────────────────────────────────────────────────────────────
project: "tau2-ART-distill-05162346"
base_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
# model_name is a BASE template. run_pipeline_local.py appends the run
# suffix (MMDDHHMM) automatically, producing an isolated name like
#   tau2-distill-...-20260511-1101-rl-05121452
# This gives each run its own .art/ checkpoint dir and its own W&B RL
# artifact collection, so every run always starts fresh from the SFT LoRA.
# sft_source.name (below) always points back to the original SFT baseline.
model_name: "tau2-distill-Qwen3-30B-A3B-Instruct-2507-20260516-1646"

# ── SFT source (pull_sft_lora.py) ─────────────────────────────────────
# Identifies which W&B artifact to seed the local .art/ checkpoint dir from.
#
# Step resolution (highest precedence first), see local/pull_sft_lora.py:
#   1. integer literal             -> downloads :step{N} as-is
#   2. .best_sft_step sidecar      -> overrides this field when present
#   3. "best"                       -> requires the sidecar; errors if missing
#   4. "latest" or unset           -> downloads the collection's :latest alias
#
# run_full_pipeline.py auto-patches step to the integer best step after SFT
# completes (reads pipeline_runs/<SUFFIX>/.best_sft_step). Keep "best" here as
# the safer default for ad-hoc runs that share a snapshot dir.
sft_source:
  entity: "kwt"
  project: "tau2-ART-distill-05162346"
  name: "tau2-distill-Qwen3-30B-A3B-Instruct-2507-20260516-1646"
  step: 7

# ── Domain / tasks ────────────────────────────────────────────────────
domain: "telecom"

# ── LLM routing ───────────────────────────────────────────────────────
# agent_llm MUST be null/omitted so training rollouts use ARTAgent against
# the local vLLM (the trainable LoRA). Setting it would switch to LLMAgent
# and bypass the policy being optimised (see tau2_art_helpers.py L615).
agent_llm:
agent_llm_args:
  temperature: 0.7
  # Dropped 1024 -> 512: observed p95=250 tokens, max=366 across 1,145 agent
  # replies — 512 covers all real outputs with headroom.  Smaller cap frees
  # KV-cache budget to support more orchestrator steps (see max_orchestrator_steps).
  max_tokens: 512

# user_llm: external dialogue simulator, unchanged from serverless config.
user_llm: "wandb/Qwen/Qwen3-30B-A3B-Instruct-2507"
user_llm_args:
  temperature: 1.0
  max_tokens: 1024

# ── KL anchor (now ACTUALLY honoured by LocalBackend.train) ───────────
# kl_penalty_reference_step is set automatically at runtime from
# .sft_endpoint_step written by pull_sft_lora.py (== the seeded SFT step).
kl_penalty_coef: 0.04

# ── Training hyperparameters ──────────────────────────────────────────
groups_per_step: 1
num_epochs: 1
rollouts_per_group: 16
learning_rate: 1.0e-7
# Bumped 40 -> 60: with max_tokens=512 (down from 1024) the per-turn token
# budget is halved, so 60 steps × ~300 avg tokens ≈ 18K tokens + ~3K prompt
# overhead = ~21K < max_model_len=24576.  Closes the gap with the leaderboard's
# max_steps=100 so the RL policy practices on longer episodes.
# (Previous limit: 50 turns + 2048 tokens grew past 32K and OOMed.)
max_orchestrator_steps: 60

# ── Validation & early stopping ───────────────────────────────────────
# Dropped 2 -> 1: last run had only 12 RL steps = 6 validation points at
# interval=2.  Denser signal lets best-step tracking and early-stop react
# faster to short runs.
validation_step_interval: 1
# Bumped 3 -> 5: last run best was step 11, stopped at 12 (3 flat evals).
# The model may have still been improving; 5 patience gives it more runway.
early_stop_patience_evals: 5
save_checkpoint_artifact: true

# ── RL pre-filter (curriculum) ────────────────────────────────────────
rl_prefilter_tasks: true
rl_prefilter_k: 4
rl_prefilter_keep_band: [0.10, 0.90]

# ── Datasets ──────────────────────────────────────────────────────────
training_dataset_artifact: "tau2-ART-telecom-training-scenarios:latest"
training_weave_dataset: "tau2-ART-telecom-training-scenarios"
validation_dataset_artifact: "tau2-ART-telecom-validation-scenarios:latest"
validation_weave_dataset: "tau2-ART-telecom-validation-scenarios"
base_weave_dataset: "tau2-ART-telecom-base-scenarios"

# ── Shaped reward ─────────────────────────────────────────────────────
shaped_reward: true
shaped_reward_weights:
  action: 0.35
  communicate: 0.10
  nl_assertions: 0.30
  termination: 0.15
  tool_accuracy: 0.15
  tool_arg_accuracy: 0.05
  step_penalty: -0.10

# ── Reproducibility ───────────────────────────────────────────────────
random_seed: 42

# ── Leaderboard evaluation ────────────────────────────────────────────
leaderboard:
  num_trials: 3
  max_steps: 100
  agent_llm_args:
    temperature: 0.0
    max_tokens: 16384
  user_llm_args:
    temperature: 0.0
    max_tokens: 16384

# ── W&B ───────────────────────────────────────────────────────────────
wandb_job_type: "train"

# ── Fields NOT present here (serverless-only, not meaningful for LocalBackend) ──
# continue_from_model:              LocalBackend uses seeded .art/ checkpoint instead
# verify_checkpoint_digest_before_train: queries W&B artifact aliases; skipped locally
# kl_beta:                          replaced by kl_penalty_coef (canonical LocalBackend name)
