# ART GRPO training configuration for tau2-bench
# Override any value via CLI args (e.g. --num-tasks 5)

# ── Model ────────────────────────────────────────────────────────────
# project: "tau2-ART-proj-0419"
# project: "tau2-ART-distill-0419"
project: "tau2-ART-distill-04211613"
base_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
model_name: "tau2-ART-telecom-Qwen3-30B-A3B-Instruct-2507"

# ── Optional: continue training in an existing model's collection ───
# When set, GRPO uses this collection name as the ART model.name, so its
# server-side trainer initializes from the collection's latest checkpoint
# (e.g. the SFT step 6 LoRA below) and appends step 7, 8, … to the same
# collection through the proper checkpoint-registration path.
#
# Why not "fork" into a new collection? `_experimental_fork_checkpoint`
# uploads bytes to W&B Artifacts but does NOT register them with W&B
# Inference, so forked artifacts are unservable. Continuing in-place is
# the only path that produces servable RL checkpoints today.
#
# Safety: existing inference endpoints pinned to a *specific version*
# (e.g. `:v6`) are unaffected — version aliases are immutable and new
# RL training only appends new versions. Anything pinned to `:latest`
# or to the SFT's `:step6` will shift to RL weights after step 7+.
#
# Comment out to train from `base_model` with a fresh LoRA in a new,
# auto-named collection.
continue_from_model: "tau2-distill-Qwen3-30B-A3B-Instruct-2507-20260419-1420"

# ── Domain / tasks ──────────────────────────────────────────────────
domain: "telecom"

# ── LLM routing (litellm provider prefix) ────────────────────────────
# Uses litellm's native W&B Inference provider (WANDB_API_KEY from env).
#
# Sampling args MUST set max_tokens — without it the W&B Inference default
# is far too small for tool-using agents and rollouts truncate to ~30-500
# tokens, producing reward 0 on every group and starving GRPO of signal.
# 0.7: keep RL rollouts closer in style to the strong SFT policy (kwt/04231441
# showed 70-tok RL practice vs ~1600-tok SFT/leaderboard — short give-ups
# from temp 1.0). Temp 0.3 on teacher in 04231209 (bad SFT) is not the same
# as here; we keep teacher 0.7 in distill. If num_groups_trainable
# collapses again, try 0.8–0.9 instead of jumping back to 1.0.
agent_llm: "wandb/Qwen/Qwen3-30B-A3B-Instruct-2507"
agent_llm_args:
  temperature: 0.7
  max_tokens: 16384
# user_llm: "wandb/Qwen/Qwen3-235B-A22B-Instruct-2507" #as of 031226 there is issue with this model
user_llm: "wandb/Qwen/Qwen3-30B-A3B-Instruct-2507"
user_llm_args:
  temperature: 1.0
  max_tokens: 16384

# ── Training hyperparameters ────────────────────────────────────────
#current setup will take around 1 hour 20 minutes to train
# Bumped rollouts_per_group 4 -> 8 and dropped groups_per_step 8 -> 4 to
# raise within-group statistical power without changing total rollouts/step.
# This is the cheapest fix for the "~99% of GRPO groups had zero variance"
# pathology observed in run kwt/tau2-ART-distill-04211613/3kxgwhmp.
groups_per_step: 4
# Bumped 1 -> 3: re-use the small set of trainable groups (post-prefilter)
# multiple times so GRPO sees more update steps from the same data.
num_epochs: 3
# Bumped 8 -> 16 after kwt/tau2-ART-distill-04221704 showed train/success=0
# over 720 trajectories. More rollouts per group raises the chance that at
# least one rollout actually solves the task, giving GRPO a positive
# example to climb toward instead of optimizing partial credit only.
rollouts_per_group: 16
# Lowered 5e-6 -> 1e-6 -> 5e-7: with no SFT KL anchor available in
# ServerlessBackend.train(), LR is the only knob to limit drift from the
# post-SFT policy. With zero successful training rollouts in 04221704 we
# halve LR again so RL stays even closer to SFT until positive examples
# appear (either organically or via larger rollouts_per_group).
learning_rate: 5.0e-7
max_orchestrator_steps: 100
# NOTE: kl_beta is currently NOT honored. The serverless ART backend's
# train() API does not expose `beta`/`kl_penalty_coef`, so this value is
# logged in the config snapshot but never wired into the loss. Kept here
# for forward-compat / documentation; remove once ART exposes the kwarg.
kl_beta: 0.04

# ── Validation & early stopping ────────────────────────────────────
# Validate every 2 RL steps (was 5) so short runs (<=30 steps) get
# multiple datapoints to drive best-step selection / early-stop.
validation_step_interval: 2
# Stop training if val/reward has not improved for this many consecutive
# validations. None / 0 disables. Used in train_tau2.py run_training.
# Bumped 2 -> 3: 04231441 had best val/reward at step 27 then noise/drift; one
# extra "flat" val before stop avoids bailing on a single bad draw.
early_stop_patience_evals: 3
save_checkpoint_artifact: true

# ── RL pre-filter (curriculum) ─────────────────────────────────────
# Before the GRPO loop, probe each training task k_probe times on the
# loaded SFT model and keep only tasks whose probe success rate falls in
# [low, high]. Tasks at 0/1 contribute zero advantage to GRPO anyway;
# focusing on the trainable middle band is much more sample-efficient.
# Set rl_prefilter_tasks: false to disable.
rl_prefilter_tasks: true
rl_prefilter_k: 4
# Widened [0.25, 0.75] -> [0.10, 0.90] after observing only 7/55 trainable
# groups in run kwt/tau2-ART-distill-04221526. Including tasks with weak
# (10-25%) or strong (75-90%) probe signal still gives non-trivial GRPO
# advantage and grows the learnable training set.
rl_prefilter_keep_band: [0.10, 0.90]

# ── Pre-GRPO checkpoint digest sanity check ────────────────────────
# When true (and continue_from_model is set), before the first GRPO step
# fetch the W&B artifact aliases :step{starting_step} and :latest on the
# `continue_from_model` collection via wandb.Api() and compare digests.
# A match means the registry head is exactly the SFT checkpoint we
# resumed from. A mismatch is logged as a warning but never fatal. The
# script also uploads a small text artifact ("checkpoint-digest-check")
# to the run for an audit trail. Note: digest is a content checksum on
# the W&B artifact; it does NOT prove server-side inference cache state.
verify_checkpoint_digest_before_train: true
# Leaderboard: optional. If unset, create_leaderboard.py uses .last_trained_model written by the latest train run.
# leaderboard_trained_model_name: "tau2-telecom-Qwen3-30B-A3B-Instruct-2507-0313-20260312-1009"
training_dataset_artifact: "tau2-ART-telecom-training-scenarios:latest"
training_weave_dataset: "tau2-ART-telecom-training-scenarios"
validation_dataset_artifact: "tau2-ART-telecom-validation-scenarios:latest"
validation_weave_dataset: "tau2-ART-telecom-validation-scenarios"
base_weave_dataset: "tau2-ART-telecom-base-scenarios"

# ── Shaped reward (continuous 0-1 for GRPO signal) ─────────────────
# When true, training uses fractional sub-metric scores instead of binary 0/1.
# Baseline/leaderboard evaluation always uses the original binary reward.
shaped_reward: true
shaped_reward_weights:
  action: 0.35
  communicate: 0.10
  nl_assertions: 0.30
  termination: 0.15
  tool_accuracy: 0.15
  tool_arg_accuracy: 0.05
  step_penalty: -0.10

# ── Reproducibility ─────────────────────────────────────────────────
random_seed: 42

# ── Leaderboard evaluation ──────────────────────────────────────────
# Bumped num_trials 1 -> 3 after observing SFT leaderboard score swing
# 17.5% -> 27.5% -> 7.5% across runs 04221526/04221704/04230729 on the
# same 40-task test set. Three trials per (task, model) pair lets us
# estimate variance and make RL-vs-SFT comparisons more trustworthy.
leaderboard:
  num_trials: 3
  max_steps: 100
  agent_llm_args:
    temperature: 0.0
    max_tokens: 16384
  user_llm_args:
    temperature: 0.0
    max_tokens: 16384

# ── W&B ─────────────────────────────────────────────────────────────
wandb_job_type: "train"
