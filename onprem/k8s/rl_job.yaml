# Templated K8s Job for the on-prem RL stage (rLLM + verl + colocated vLLM TP=8).
#
# Placeholders (substituted by run_pipeline.py before kubectl apply):
#   __JOB_NAME__               e.g. tau2-rl-04270927
#   __IMAGE__                  e.g. ghcr.io/<gh-user>/tau2-rllm:abc1234
#   __STARTING_LORA_URI__      e.g. wandb-artifact:///team/proj/sft-lora-name:latest
#   __WANDB_PROJECT__          e.g. tau2-ART-autoresearch-telecom
#   __WANDB_RUN_GROUP__        e.g. pipeline-04270927
#   __WANDB_NAME__             e.g. rl-04270927
#   __PIPELINE_SUFFIX__        e.g. 04270927
#   __LORA_ARTIFACT_NAME__     e.g. tau2-rl-Qwen3-30B-A3B-Instruct-2507-04270927
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: tau2
  labels:
    app.kubernetes.io/part-of: tau2-onprem
    app.kubernetes.io/component: rl
    pipeline-suffix: "__PIPELINE_SUFFIX__"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: tau2-onprem
        app.kubernetes.io/component: rl
        pipeline-suffix: "__PIPELINE_SUFFIX__"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: trainer
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/workspace/scripts/run_rllm_rl.sh"]
          resources:
            limits:
              nvidia.com/gpu: 8
            requests:
              cpu: "16"
              memory: 400Gi
              nvidia.com/gpu: 8
          env:
            - { name: WANDB_API_KEY, valueFrom: { secretKeyRef: { name: wandb,  key: api } } }
            - { name: HF_TOKEN,      valueFrom: { secretKeyRef: { name: hf,     key: token } } }
            - { name: RLLM_API_KEY,  valueFrom: { secretKeyRef: { name: rllmui, key: api } } }
            - { name: WANDB_PROJECT,             value: "__WANDB_PROJECT__" }
            - { name: WANDB_RUN_GROUP,           value: "__WANDB_RUN_GROUP__" }
            - { name: WANDB_NAME,                value: "__WANDB_NAME__" }
            - { name: STARTING_LORA_URI,         value: "__STARTING_LORA_URI__" }
            - { name: STARTING_LORA_DIR,         value: "/artifacts/sft-lora" }
            - { name: RL_OUTPUT_DIR,             value: "/artifacts/rl-lora" }
            - { name: PIPELINE_SUFFIX,           value: "__PIPELINE_SUFFIX__" }
            - { name: LORA_ARTIFACT_NAME,        value: "__LORA_ARTIFACT_NAME__" }
            - { name: HF_HUB_ENABLE_HF_TRANSFER, value: "1" }
            # Persist the HF Hub cache on the artifacts PVC so the 60GB
            # Qwen3-30B-A3B-Instruct-2507 weights survive pod restarts and
            # don't get re-downloaded every K8s job (which also occasionally
            # races / 429s and trips OSError "no model files found").
            - { name: HF_HOME,                   value: "/artifacts/hf-cache" }
            - { name: HUGGINGFACE_HUB_CACHE,     value: "/artifacts/hf-cache/hub" }
            - { name: TOKENIZERS_PARALLELISM,    value: "false" }
            - { name: NCCL_P2P_DISABLE,          value: "0" }
            - { name: NCCL_DEBUG,                value: "WARN" }
            # Tell rLLM where to point its tracked policy client. The colocated
            # vLLM server is started by verl on this address.
            - { name: POLICY_BASE_URL,           value: "http://127.0.0.1:8000/v1" }
            - { name: POLICY_MODEL_NAME,         value: "policy" }
          volumeMounts:
            - { name: artifacts, mountPath: /artifacts }
            - { name: data,      mountPath: /data }
            - { name: shm,       mountPath: /dev/shm }
      volumes:
        - { name: artifacts, persistentVolumeClaim: { claimName: tau2-artifacts } }
        - { name: data,      persistentVolumeClaim: { claimName: tau2-data } }
        - { name: shm,       emptyDir: { medium: Memory, sizeLimit: 128Gi } }
