# Axolotl SFT recipe for the on-prem tau2 distillation stack.
#
# All hyperparameters mirror train_distill_config.yaml. The dataset path is
# materialized at runtime by run_axolotl_sft.sh after downloading the W&B
# dataset artifact written by onprem/scripts/prepare_sft_data.py.
#
# Hardware target: single node, 8x H100 80GB SXM5.
# Distributed strategy: FSDP2 full_shard via `accelerate launch --num_processes 8`.

# ----- model -----
base_model: Qwen/Qwen3-30B-A3B-Instruct-2507
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
load_in_8bit: false
load_in_4bit: false
strict: false
# Qwen3-MoE (model_type: qwen3_moe) is natively supported by transformers
# -- no remote modeling code needed. Setting trust_remote_code: true makes
# Axolotl tell the CCE patcher to treat the model as "remote" (dynamic
# Hub code) and try to read it from /root/.cache/huggingface/modules/...,
# which doesn't exist. That manifested as
#   FileNotFoundError: '/root/.cache/huggingface/modules/transformers.models.qwen3_moe.modeling_qwen3_moe'
# inside cut_cross_entropy/transformers/qwen3_moe.py:patch_qwen3_moe.
# Setting this to false routes CCE through the built-in patch path.
trust_remote_code: false

# ----- LoRA -----
# rank 16 = the maximum W&B Inference accepts for Qwen/Qwen3-30B-A3B-Instruct-2507.
# Target modules now include the per-expert MLP projections (gate_proj /
# up_proj / down_proj) in addition to attention. Tau2 telecom is heavily
# tool-using and benefits from MLP/expert adaptation; attention-only LoRA was
# capacity-limited (val success 0.0833). Adapter size grows but stays within
# W&B Inference's load budget for rank 16, and the on-prem RL stack already
# uses target_modules=all-linear (peft picks all linear layers), so this
# brings SFT into parity with RL's adaptable surface.
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_modules_to_save: []

# ----- dataset -----
# `chat_template: qwen3` consumes records of the form
#   {"messages": [{role, content, tool_calls?}, ...], "tools": [...]}
# which is exactly what onprem/scripts/trajectory_to_jsonl.py emits.
chat_template: qwen3
datasets:
  - path: /data/sft.jsonl
    type: chat_template
    field_messages: messages
# Reserve 5% of the SFT JSONL as an in-training validation slice so axolotl
# emits eval/loss curves alongside training loss. The leaderboard stage is
# still the ground-truth evaluator (binary success on tau2 tasks), but with
# small success-filtered datasets (~13-200 trajectories) overfitting can
# happen well before leaderboard catches it -- the prior "2e-4 was overfitting
# on small (~13 traj) datasets" note in train_distill_config.yaml is a
# documented example. 5% is a tradeoff: small enough to keep the train set
# rich, large enough that eval/loss is not pure noise.
val_set_size: 0.05

# ----- sequence packing / context length -----
# Sample packing avoids padding waste for the variable-length tool-using
# rollouts. Tau2 telecom rollouts at max_orchestrator_steps=100 routinely
# exceed 8192 tokens (observed: min ~7.9K, median ~9.7K, max ~14.7K tokens
# across 228 records). Anything that exceeds `sequence_len` is silently
# dropped by axolotl's "Drop Invalid Sequences" pass.
# Bumped 16384 -> 24576: the previous cap left almost no headroom above the
# observed max (14.7K) for chat-template overhead (tool schemas, <think>
# blocks, im_start/im_end tokens) and was likely silently dropping the
# longest successful trajectories. 24576 gives 1.6x headroom above the
# observed max while staying well within Qwen3's native context.
sequence_len: 24576
sample_packing: true
pad_to_sequence_len: true

# ----- training schedule (mirrors train_distill_config.yaml) -----
# micro_batch_size=1 is required at sequence_len=24576 to avoid OOM.
# gradient_accumulation_steps=4 → effective_batch = 1*4*8 = 32 sequences/update.
# With ~93-138 packed sequences at this seq_len, that gives ~3-4 optimizer
# updates per epoch × 4 epochs = ~12-16 total updates. Previous setting of
# grad_accum=8 → effective_batch=64 → only ~1.5 updates/epoch ≈ 3 total,
# which was too few for the model to learn the task (SFT scored 9.2% ≈ base).
# Reducing grad_accum from 8→4 doubles optimizer steps without touching memory.
num_epochs: 4
micro_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
warmup_ratio: 0.1
lr_scheduler: cosine
optimizer: adamw_torch
weight_decay: 0.0

bf16: auto
tf32: true

# Activation checkpointing belongs in `fsdp_config` under FSDP2, NOT as a
# top-level `gradient_checkpointing: true`. The HF Trainer warns:
#   "When using FSDP full shard, instead of using `gradient_checkpointing`
#    in TrainingArguments, please use `activation_checkpointing` in
#    `fsdp_config`. The former introduces a redundant AllGather operation
#    in backward pass."
# Using the wrong path (a) wastes memory by holding extra all-gathered
# shards during backward, and (b) is exactly what triggered our prior OOM
# at grouped_mm_experts_forward on the MoE layer.

flash_attention: true

# Cut Cross Entropy: fused CE kernel that computes loss without ever
# materializing the (seq_len, vocab_size) logits tensor in fp32. With
# seq_len=16384 and Qwen3 vocab=151,936, naive `logits.float()` allocates
# ~9.94 GiB by itself -- which is exactly the 9.27 GiB we OOM'd on at
# transformers/loss/loss_utils.py:55 after fixing fragmentation. Using
# CCE drops peak memory by roughly that whole amount with no quality
# impact (it's mathematically equivalent, just streamed).
#
# IMPORTANT: `cut_cross_entropy: true` is silently ignored unless the
# CutCrossEntropyPlugin is loaded via `plugins:`. The plugin registers
# the field into Axolotl's config schema; without it, Axolotl drops the
# key on the floor and your run still OOMs at the loss. The CCE package
# itself is already pip-installed in our base image (axolotlai/axolotl).
plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
cut_cross_entropy: true

# Defensive: use Axolotl's tiled MLP path which processes hidden states
# in chunks instead of materializing the full (S, hidden) MLP activation
# at once. Notable for big MoE models like Qwen3-30B-A3B where the per-
# token expert activations dominate. This is a no-quality-impact memory
# trade: slightly slower MLP, much smaller peak.
tiled_mlp_use_original_mlp: false

# Activation offloading: stream saved activations off-GPU to pinned CPU
# memory during the forward pass and bring them back during backward.
# After CCE eliminated the 10 GiB logits OOM in the loss, the next OOM
# moved to backward (loss.backward()) at 73.97 GiB allocated / 78.35 GiB
# used / 0.84 GiB free, asking for another 1 GiB. Activation
# checkpointing alone wasn't enough -- some saved tensors at the FSDP2
# wrap boundaries still pin >70 GiB on each H100. Offloading those to
# CPU cuts peak by another 4-8 GiB on this model with a modest (~5-15%)
# wallclock cost via overlapped streams. Cheap insurance for our case.
#
# Axolotl's pydantic validator hard-requires `gradient_checkpointing`
# whenever `activation_offloading` is set, even though we already enable
# it via `fsdp_activation_checkpointing: true` inside fsdp_config. We
# pass both -- they're functionally redundant under FSDP2 (both end up
# calling apply_activation_checkpointing) but the validator demands the
# top-level flag. The earlier "use fsdp_activation_checkpointing instead"
# warning is informational; setting both does NOT double-wrap.
gradient_checkpointing: true
activation_offloading: true

# ----- FSDP (8-way full shard across the 8 H100s) -----
fsdp:
  - full_shard
  - auto_wrap
fsdp_config:
  fsdp_version: 2
  fsdp_limit_all_gathers: true
  fsdp_sync_module_states: true
  fsdp_offload_params: false
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen3MoeDecoderLayer
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_activation_checkpointing: true

# ----- output -----
# /artifacts is a PVC mounted into the pod. The post-train hook in
# run_axolotl_sft.sh pulls the merged PEFT dir from here and uploads it
# as a type=lora W&B Inference artifact.
output_dir: /artifacts/sft-lora
saves_per_epoch: 1
save_total_limit: 2
save_safetensors: true

# ----- logging / W&B -----
# wandb_project / wandb_name / wandb_group are set at runtime by
# run_axolotl_sft.sh via env vars (WANDB_PROJECT, WANDB_NAME, WANDB_RUN_GROUP)
# so the SFT run lands in the same group as the rest of the pipeline iteration.
logging_steps: 1
report_to:
  - wandb

# ----- reproducibility -----
seed: 42
