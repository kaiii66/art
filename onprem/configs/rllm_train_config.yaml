# rLLM (verl backend) GRPO recipe for tau2-bench. Mirrors train_config.yaml.
#
# Consumed by rllm_train_tau2.py at runtime. Most fields are passed straight
# to AgentTrainer; the rollout-specific ones (max_orchestrator_steps,
# shaped_reward_weights) are bound into the @rllm.rollout closure.

# ----- model -----
base_model: Qwen/Qwen3-30B-A3B-Instruct-2507
lora_rank: 16
lora_alpha: 32
# Attention-only LoRA, same constraint as SFT (W&B Inference cap = 16 for this
# base; expert MLPs would balloon adapter size on a 128-expert MoE).
lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

# ----- algorithm -----
algorithm: grpo
learning_rate: 5.0e-7
num_epochs: 1
groups_per_step: 4
rollouts_per_group: 16

# ----- rollout server (colocated vLLM) -----
rollout:
  name: vllm
  tensor_parallel_size: 8
  gpu_memory_utilization: 0.85
  max_model_len: 16384
  enforce_eager: false
  enable_lora: true
  max_lora_rank: 16

# ----- environment + scoring -----
domain: telecom
max_orchestrator_steps: 100
agent_llm_args:
  temperature: 0.7
  max_tokens: 16384
user_llm: wandb/Qwen/Qwen3-30B-A3B-Instruct-2507
user_llm_args:
  temperature: 1.0
  max_tokens: 16384
shaped_reward: true
shaped_reward_weights:
  action: 0.35
  communicate: 0.10
  nl_assertions: 0.30
  termination: 0.15
  tool_accuracy: 0.15
  tool_arg_accuracy: 0.05
  step_penalty: -0.10

# ----- dataset -----
training_dataset_artifact: tau2-ART-telecom-training-scenarios:latest
validation_dataset_artifact: tau2-ART-telecom-validation-scenarios:latest

# ----- observability -----
project: tau2-ART-autoresearch-telecom
loggers: [console, wandb, ui]   # 'ui' = rllm-ui cloud (ui.rllm-project.com)

random_seed: 42
