# Hydra overlay for the on-prem tau2-bench RL trainer.
#
# Layered on top of rllm's `agent_ppo_trainer` config (which itself layers on
# verl's `ppo_trainer`). Only the values we actually want to deviate from
# rllm/verl defaults live here -- everything else is inherited.
#
# Migration note (rllm v0.2.1 → v0.3.0-pre):
#   - Rollout engine: vLLM (colocated TP=8) → SGLang (disaggregated 4+4)
#   - hybrid_engine: true → false  (actor and rollout on separate GPU groups)
#   - tensor_model_parallel_size: 8 → 4 (rollout uses 4 GPUs; actor FSDP on 4)
#   - Removed: gpu_memory_utilization, free_cache_engine, layered_summon,
#     load_format, enforce_eager, engine_kwargs.vllm (colocated workarounds)
#   - Restored: trainer.logger: [console, wandb, ui] (verl 0.7.1 + rllm v0.3)
#
# Usage:
#   python -m onprem.scripts.rllm_train_tau2 \
#       --config-path /workspace/configs \
#       --config-name tau2_overrides \
#       trainer.n_gpus_per_node=8

hydra:
  searchpath:
    - pkg://rllm.trainer.config
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

# ---------------------------------------------------------------------------
# tau2-specific config (consumed by rllm_train_tau2.py only; not by verl).
# ---------------------------------------------------------------------------
tau2:
  project: tau2-ART-autoresearch-telecom
  group: null  # K8s sets WANDB_RUN_GROUP

  workflow:
    max_steps: 100

  env:
    domain: telecom
    max_user_errors: 10
    shaped_reward_weights:
      action: 0.35
      communicate: 0.10
      nl_assertions: 0.30
      termination: 0.15
      tool_accuracy: 0.15
      tool_arg_accuracy: 0.05
      step_penalty: -0.10

  agent:
    domain: telecom
    parser_name: qwen

  user:
    model: wandb/Qwen/Qwen3-30B-A3B-Instruct-2507
    llm_args:
      temperature: 1.0
      max_tokens: 16384

  dataset:
    name: tau2-telecom
    training_artifact: tau2-ART-telecom-training-scenarios:latest
    validation_artifact: tau2-ART-telecom-validation-scenarios:latest
    validation_split: test
    num_train_tasks: null
    num_val_tasks: null

  prefilter:
    enable: true
    probe_llm: null
    probe_llm_args:
      temperature: 0.7
      max_tokens: 4096
    k_probe: 4
    keep_band: [0.10, 0.90]
    concurrency: 8

# ---------------------------------------------------------------------------
# verl/rllm overrides.
# ---------------------------------------------------------------------------
algorithm:
  adv_estimator: grpo
  kl_ctrl:
    kl_coef: 0.001
  use_kl_in_reward: false

data:
  train_batch_size: 32
  val_batch_size: 64
  max_prompt_length: 12288
  max_response_length: 4096
  gen_batch_size: ${data.train_batch_size}
  return_multi_modal_inputs: false

actor_rollout_ref:
  # disaggregated: actor (FSDP, GPUs 0-3) and rollout (SGLang, GPUs 4-7) on
  # separate Ray placement groups. hybrid_engine: false disables colocated mode.
  hybrid_engine: false
  model:
    path: Qwen/Qwen3-30B-A3B-Instruct-2507
    use_remove_padding: true
    enable_gradient_checkpointing: true
    lora_rank: 16
    lora_alpha: 32
    target_modules: "all-linear"
  actor:
    optim:
      lr: 5.0e-7
    strategy: fsdp2
    loss_agg_mode: token-mean
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 24000
    use_kl_loss: false
    clip_ratio_high: 0.2
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ulysses_sequence_parallel_size: 1
    entropy_coeff: 0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: sglang
    mode: async
    agent:
      num_workers: 0
    # Rollout uses 4 GPUs (TP=4); actor FSDP uses the remaining 4.
    # SGLang natively supports Qwen3-MoE LoRA without the fused-qkv workarounds
    # that vLLM colocated required (fully_sharded_loras, disable_custom_all_reduce).
    tensor_model_parallel_size: 4
    max_model_len: 16384
    temperature: 0.7
    top_p: 0.95
    n: 16
    val_kwargs:
      n: 1
      temperature: 0.7
      top_p: 0.95
      do_sample: true
    log_prob_micro_batch_size_per_gpu: 1
    engine_kwargs:
      # SGLang defaults work for Qwen3-MoE; tune during smoke if needed.
      sglang: {}
  ref:
    fsdp_config:
      param_offload: false
    log_prob_micro_batch_size_per_gpu: 1

# ----- rllm section -----
rllm:
  agent:
    name: tau2_assistant
    max_steps: ${tau2.workflow.max_steps}
    trajectory_timeout: null
    overlong_filter: false
    agent_args: {}
    engine_args: {}
  env:
    name: tau2_env
    env_args: {}
  workflow:
    use_workflow: true
    name: multi_turn_workflow
    workflow_args:
      agent_cls: null
      agent_args: {}
      env_cls: null
      env_args: {}
      timeout: 1000000
      gamma: 0.0
      reward_bonus_coeff: 0.0
    n_parallel_tasks: 32
    retry_limit: 2
  disable_thinking: false
  accumulate_reasoning: false
  mask_truncated_samples: false
  filter_token_mismatch: true
  stepwise_advantage:
    enable: false
    mode: broadcast
    normalize_by_steps: false
  compact_filtering:
    enable: true
    mask_max_prompt_length_exceeded: true
    mask_max_response_length_exceeded: true
    mask_env_done: false
    mask_max_turns_exceeded: false
    mask_timeout: true
    mask_unknown: false
    mask_error: true
  rejection_sample:
    enable: false
    multiplier: 1
  sdk:
    store:
      path: ~/.rllm/traces.db
    processing:
      groupby_key: null
      traj_name_key: null
    proxy:
      host: 127.0.0.1
      port: 4000
      mode: subprocess
      admin_token: my-shared-secret

fireworks:
  deployment_id: null
  model_id_prefix: test-model
  concurrency: 32

trainer:
  project_name: tau2-ART-autoresearch-telecom
  experiment_name: rl-${oc.env:PIPELINE_SUFFIX,manual}
  logger:
    - console
    - wandb
    # rllm v0.3.0-pre + verl 0.7.1 support the "ui" backend natively via
    # rllm's UILogger. RLLM_API_KEY is mounted into the pod via the rllmui
    # K8s secret. Streams per-episode trajectories + metrics to rllm-ui.
    - ui
  n_gpus_per_node: 8
  nnodes: 1
  total_epochs: 1
  save_freq: 1
  max_actor_ckpt_to_keep: 8
  test_freq: 5
  val_before_train: true
  critic_warmup: 0
  default_local_dir: /artifacts/rl-lora
  default_hdfs_dir: null
  log_episodes: true
